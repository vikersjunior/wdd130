<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Get in touch with Rapids Rafting to book your adventure, ask questions, or learn more about our rafting trips.">
    <meta name="author" content="Afotey Clement Nii Odai">
    <title>Contact Us - Rapids Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/logo.jpg" alt="">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Contact Section -->
        <section class="bg-none">
            <!-- Contact info Section -->
            <div class="contact-info">
                <h1>Rapids Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Accra, Ghana</p>
                <p>+233 052 999 9999</p>
                <p>info@rapidsrafting.com</p>
            </div>
            <div class="contact-container">
                <!-- Map on Left -->
                <div class="map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6368.3858620511655!2d0.10435193688823416!3d5.72140879359686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10207d84f5845ecb%3A0x73f094fdaf4b2f3c!2sGhana%20Water%20Company%20Limited!5e0!3m2!1sen!2sgh!4v1764104604226!5m2!1sen!2sgh"
                        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <!-- Form on Right -->
                <form>
                    <!-- Name Input -->
                    <div class="form-group form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>

                    <!-- Email Input -->
                    <div class="form-group form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>

                    <!-- Message Purpose Radio Buttons -->
                    <div class="form-group form-row">
                        <label class="">Message Purpose</label>
                        <div>
                            <div class="radio-option">
                                <input type="radio" id="general" name="message_purpose" value="general_inquiry">
                                <label for="general">General Inquiry</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="reservation" name="message_purpose"
                                    value="reservation_question">
                                <label for="reservation">Reservation Question</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="website" name="message_purpose" value="website_suggestion">
                                <label for="website">Website Suggestion</label>
                            </div>
                        </div>

                    </div>

                    <!-- Message Textarea -->
                    <div class="form-group form-column">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>
                    </div>

                    <!-- Newsletter Checkbox -->
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <!-- Staff Section -->
        <section class="employee-section section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-container">
                <figure class="employee-card">
                    <img src="images/ceo.webp" alt="CEO - Clement">
                    <figcaption>CEO - Clement</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/cto.webp" alt="CTO - Jennifer">
                    <figcaption>CTO - Jennifer</figcaption>
                </figure>

                <figure class="employee-card">
                    <img src="images/cfo.webp" alt="CFO - Sophia">
                    <figcaption>CFO - Sophia</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2025 🌊 Rapid Rafting 🌊 Afotey Clement Nii Odai </p>
        <nav class="socialmedia">
            <a href="facebook.com">
                <img src="images/facebook.svg" alt="facebook icon">
            </a>
            <a href="instagram.com">
                <img src="images/instagram.svg" alt="facebook icon">
            </a>
            <a href="linkedin.com">
                <img src="images/linkedin.svg" alt="facebook icon">
            </a>
        </nav>
    </footer>
</body>

</html>
